name: mo5y
description: "A new Flutter project."
publish_to: "none"
version: 1.0.2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_speed_dial: ^7.0.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true

  assets:
    - assets/logo/mo5y_logo.png

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Thin.ttf
          weight: 100
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Black.ttf
          weight: 900
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/mo5y_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/logo/mo5y_logo.png"

flutter_native_splash:
  color: "#121212"
  image: assets/logo/mo5y_logo.png
  android_12:
    image: assets/logo/mo5y_logo.png
    icon_background_color: "#121212"